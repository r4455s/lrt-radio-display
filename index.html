<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>LRT Radio for Meta Ray-Ban Display</title>

  <style>
    :root {
      --bg: #050505;
      --panel: rgba(18, 18, 18, 0.86);
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --border: rgba(255,255,255,0.18);
      --green: #00ff66;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(92vw, 620px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,0.5);
      transition: all 0.6s ease;
    }

    main.minimized {
      width: 12px !important;
      height: 12px !important;
      padding: 0 !important;
      border-radius: 50% !important;
      background: var(--green) !important;
      border: none !important;
      box-shadow: 0 0 12px var(--green);
      overflow: hidden;
      color: transparent !important;
    }

    main.minimized * {
      display: none !important;
    }

    .station {
      font-size: clamp(28px, 8vw, 54px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: clamp(14px, 3.2vw, 22px);
      color: var(--muted);
      margin-bottom: 24px;
    }

    .status {
      min-height: 36px;
      font-size: clamp(18px, 4.5vw, 30px);
      margin-bottom: 22px;
      font-weight: 650;
    }

    .buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 16px 28px;
      background: #fff;
      color: #000;
      font-size: clamp(18px, 4.5vw, 28px);
      font-weight: 750;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: var(--text);
    }

    .hint {
      margin-top: 22px;
      color: var(--muted);
      font-size: clamp(12px, 3vw, 17px);
      line-height: 1.35;
    }

    .pulse {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 10px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: middle;
      opacity: 0.85;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.8); opacity: 0.45; }
      50% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>

<body>
  <main id="app" aria-label="LRT Radio player">
    <div class="station">LRT RADIJAS</div>
    <div class="subtitle">Live webstream for Meta Ray-Ban Display</div>
    <div id="status" class="status">Ready</div>

    <div class="buttons">
      <button id="playBtn">Play</button>
      <button id="stopBtn" class="secondary">Stop</button>
    </div>

    <div class="hint">
      Tap / select Play. After 10 seconds the screen becomes a small green dot.
    </div>
  </main>

  <audio id="radio" preload="none" playsinline></audio>

  <script>
    const STREAMS = [
      "https://stream-live.lrt.lt/radio_radijas/lrt_radijas.m3u8",
      "https://stream-audio.lrt.lt/radijas/320k/lrt_radijas.m3u8",
      "http://lrt-cast.lrt.lt:8000/lrt_radijas"
    ];

    const app = document.getElementById("app");
    const audio = document.getElementById("radio");
    const statusEl = document.getElementById("status");
    const playBtn = document.getElementById("playBtn");
    const stopBtn = document.getElementById("stopBtn");

    let streamIndex = 0;
    let minimizeTimer = null;

    function setStatus(text, active = false) {
      statusEl.innerHTML = active ? `<span class="pulse"></span>${text}` : text;
    }

    function minimizeAfterDelay() {
      clearTimeout(minimizeTimer);
      minimizeTimer = setTimeout(() => {
        app.classList.add("minimized");
      }, 10000);
    }

    function restoreUI() {
      app.classList.remove("minimized");
      clearTimeout(minimizeTimer);
    }

    async function playCurrentStream() {
      restoreUI();

      const url = STREAMS[streamIndex];
      setStatus("Connecting…");
      audio.src = url;

      try {
        await audio.play();
        setStatus("Playing live", true);
        minimizeAfterDelay();
      } catch (err) {
        console.warn("Stream failed", url, err);

        if (streamIndex < STREAMS.length - 1) {
          streamIndex += 1;
          return playCurrentStream();
        }

        setStatus("Could not play stream");
      }
    }

    playBtn.addEventListener("click", () => {
      streamIndex = 0;
      playCurrentStream();
    });

    stopBtn.addEventListener("click", () => {
      restoreUI();
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      setStatus("Stopped");
    });

    audio.addEventListener("playing", () => {
      setStatus("Playing live", true);
      minimizeAfterDelay();
    });

    audio.addEventListener("waiting", () => {
      restoreUI();
      setStatus("Buffering…");
    });

    audio.addEventListener("error", () => {
      restoreUI();

      if (streamIndex < STREAMS.length - 1) {
        streamIndex += 1;
        playCurrentStream();
      } else {
        setStatus("Stream error");
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault();

        if (audio.paused) {
          streamIndex = 0;
          playCurrentStream();
        } else {
          stopBtn.click();
        }
      }
    });

    document.body.addEventListener("click", () => {
      if (app.classList.contains("minimized")) {
        restoreUI();
        minimizeAfterDelay();
      }
    });
  </script>
</body>
</html>
